name: Offline regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: CPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host-side patch and launcher regressions
        run: |
          python3 tests/test_patch_v41_tool_constraint.py
          python3 tests/test_ring_mesh_pipefail.py
          python3 -m unittest \
            tests/test_sps_engram_guard.py \
            tests/test_stop_nfs_filter.py \
            tests/test_required_sglang_args.py \
            tests/test_launcher_build.py \
            tests/test_sglang_bounded_replay_patch.py \
            tests/test_sglang_layer20_tail_patch.py \
            tests/test_sglang_prefill_interval_min_bs_patch.py \
            tests/test_sglang_parallel_prompt_encode_patch.py \
            tests/test_sglang_dsv41_inline_system_patch.py \
            tests/test_sglang_dsv41_tool_images_thinking_patch.py \
            tests/test_sglang_dsv41_padded_query_buffer_patch.py \
            tests/test_sglang_dsv41_dp_padding_patch.py \
            tests/test_sglang_mhc_prewarm_no_chunk_patch.py \
            tests/test_sglang_dsv41_plain_text_patch.py \
            tests/test_sglang_dsv41_reasoning_end_patch.py \
            tests/test_sglang_dspark_draft_params_patch.py \
            tests/test_sglang_dspark_accept_outputs_patch.py \
            tests/test_sglang_dspark_softmax_clamp_patch.py \
            tests/test_sglang_dspark_param_restage_patch.py \
            tests/test_sglang_mxfp8_decode_tactics_patch.py \
            tests/test_sglang_dsv41_indexer_inplace_patch.py \
            tests/test_sglang_dsv41_blocked_kv_dequant_patch.py \
            tests/test_sglang_dsv41_align_indexer_width_patch.py \
            tests/test_sglang_dsv41_default_thinking_patch.py \
            tests/test_sglang_dsv41_thinking_parity_patch.py \
            tests/test_sglang_dsv41_window_history_src_patch.py \
            tests/test_sglang_dsv41_fused_window_layout_patch.py \
            tests/test_sglang_dsv41_idle_swa_store_patch.py \
            tests/test_sglang_dsv41_draft_metadata_glue_patch.py \
            tests/test_sglang_greedy_flags_refresh_patch.py \
            tests/test_b12x_memory_requirements.py \
            tests/test_b12x_next_claim_barrier.py \
            tests/test_roce_ring.py \
            tests/test_remote_dotenv.py \
            tests/test_upstream_launcher_ports.py \
            tests/test_adapter_engine_pins.py
      - name: Engram row store (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -Wall -Wextra -Werror -std=c++17 -shared -fPIC -pthread \
            adapter/row_store.cpp -o adapter/librow_store.so
          python3 tests/test_row_store.py
          ROW_STORE_TEST_DIR="$RUNNER_TEMP" python3 tests/test_row_store_keepalive.py
      - name: Syntax checks
        run: |
          python3 -m py_compile \
            boot.py \
            runtime/patch_v41_tool_constraint.py \
            runtime/sglang/deepseekv41_detector.py \
            scripts/verify_sglang_layer20_tail.py \
            scripts/verify_sglang_prefill_interval_min_bs.py \
            scripts/verify_sglang_parallel_prompt_encode.py \
            scripts/verify_sglang_dsv41_inline_system.py \
            scripts/verify_sglang_dsv41_tool_images_thinking.py \
            scripts/test_sglang_dsv41_tool_images_thinking.py \
            scripts/verify_sglang_dsv41_padded_query_buffer.py \
            scripts/test_sglang_dsv41_padded_query_buffer.py \
            scripts/verify_sglang_dsv41_dp_padding.py \
            scripts/test_sglang_dsv41_dp_padding.py \
            scripts/verify_sglang_mhc_prewarm_no_chunk.py \
            scripts/test_sglang_mhc_prewarm_no_chunk.py \
            scripts/verify_sglang_dsv41_plain_text.py \
            runtime/patch_dsv41_plain_text_encode.py \
            scripts/verify_sglang_dsv41_reasoning_end.py \
            scripts/run_sglang_45458_upstream_test.py \
            runtime/patch_dsv41_reasoning_end_token.py \
            scripts/verify_sglang_dspark_draft_params.py \
            runtime/patch_dspark_draft_params.py \
            scripts/verify_sglang_dspark_accept_outputs.py \
            scripts/verify_sglang_dspark_softmax_clamp.py \
            scripts/test_sglang_dspark_softmax_clamp.py \
            scripts/verify_sglang_dspark_param_restage.py \
            scripts/test_sglang_dspark_param_restage.py \
            scripts/verify_sglang_mxfp8_decode_tactics.py \
            scripts/verify_sglang_dsv41_indexer_inplace.py \
            scripts/verify_sglang_dsv41_blocked_kv_dequant.py \
            scripts/test_sglang_dsv41_blocked_kv_dequant.py \
            scripts/verify_sglang_dsv41_align_indexer_width.py \
            scripts/test_sglang_dsv41_align_indexer_width.py \
            scripts/verify_sglang_dsv41_default_thinking.py \
            scripts/test_sglang_dsv41_default_thinking.py \
            scripts/verify_sglang_dsv41_thinking_parity.py \
            scripts/test_sglang_dsv41_thinking_parity.py \
            scripts/verify_sglang_dsv41_window_history_src.py \
            scripts/test_sglang_dsv41_window_history_src.py \
            scripts/verify_sglang_dsv41_fused_window_layout.py \
            scripts/test_sglang_dsv41_fused_window_layout.py \
            scripts/verify_sglang_dsv41_idle_swa_store.py \
            scripts/test_sglang_dsv41_idle_swa_store.py \
            scripts/verify_sglang_dsv41_draft_metadata_glue.py \
            scripts/test_sglang_dsv41_draft_metadata_glue.py \
            scripts/verify_sglang_greedy_flags_refresh.py \
            scripts/test_sglang_greedy_flags_refresh.py \
            tests/test_sps_engram_guard.py \
            tests/test_stop_nfs_filter.py \
            tests/test_b12x_memory_requirements.py \
            tests/test_b12x_next_claim_barrier.py \
            tests/test_v41_tool_constraint.py
          bash -n start.sh stop.sh scripts/fetch-sglang-canary.sh
      - name: Vendored detector identity
        run: |
          test "$(shasum -a 256 runtime/sglang/deepseekv41_detector.py | awk '{print $1}')" = \
            1db7eb88dfed0530a4c85231e525da83a5fd009e4feb85610bffd94d4c8c3672

  stage-sglang:
    # The image builds from the tree this script stages on the host. Run it with GNU patch
    # (Linux, as on a DGX Spark) and BSD patch (macOS): a hunk that only one of them accepts
    # broke Linux staging for four backports until 2026-10-22.
    name: Stage SGLang canary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and patch the pinned SGLang tree
        run: bash scripts/fetch-sglang-canary.sh
